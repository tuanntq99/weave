# Deploys Notes to Cloudflare when a version tag (v1.2.3) is pushed, only
# once the repository has the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# secrets (README: Deploying from GitHub Actions). Without them every step
# is skipped.
name: Deploy
on:
  push:
    tags: ["v*"]
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with: { node-version: 24, cache: npm }
      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: npm run test:server
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: npm run deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
